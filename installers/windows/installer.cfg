# The Windows installer, built with pynsist (https://pynsist.readthedocs.io).
#
#   installers\windows\build.ps1            from the repository root
#
# What it makes: Ninaivu-Lite-<version>-windows-x64.exe, an NSIS installer that
# puts a private Python, Ninaivu Lite and every wheel it needs in one folder
# (no Python needed on the computer, nothing downloaded at install time), adds
# the Control Panel to the Start menu and the Desktop, starts Ninaivu Lite at
# sign-in when that box is left ticked, and opens the Control Panel when it
# finishes.
#
# build.ps1 rewrites __VERSION__ from ninaivu_lite/version.py, __PYTHON__ from
# .python-version, and builds the
# wheels under wheels\, so nothing here is pinned by hand.

[Application]
name=Ninaivu Lite
version=__VERSION__
# The Control Panel, not the server: the window that starts and stops Ninaivu
# Lite is what a person opens. pythonw, so no console window.
entry_point=ninaivu_lite.panel:main
console=false
icon=ninaivu-lite.ico
license_file=..\..\LICENSE
publisher=Jagadeesh Rajendran

[Python]
# Filled in by build.ps1 from .python-version: the one Python every installer carries.
version=__PYTHON__
bitness=64
include_msvcrt=true

[Include]
# Ninaivu Lite and everything requirements.txt resolves to, built as wheels by
# build.ps1 into this folder.
local_wheels=wheels\*.whl
# Tk for the Control Panel: the embeddable Python has none, so build.ps1 copies
# tkinter and the Tcl/Tk DLLs into pynsist_pkgs\ and the Tcl library into tcl\,
# which goes where _tkinter looks for it, under the private Python.
files=..\..\README.md
      ..\..\LICENSE
      ..\..\CHANGELOG.md
      tcl > $INSTDIR\Python

[Command ninaivu-lite]
# `ninaivu-lite` on the command line, for those who want it.
entry_point=ninaivu_lite.__main__:main

[Build]
installer_name=Ninaivu-Lite-__VERSION__-windows-x64.exe
nsi_template=ninaivu-lite.nsi
