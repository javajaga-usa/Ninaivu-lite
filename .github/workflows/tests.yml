name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The oldest Python Ninaivu Lite runs on from source, and the one the
        # installers carry (.python-version; tests/test_python_version.py
        # keeps this line in step with it).
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -rfE --tb=short 2>&1 | tee pytest.log
      # The end of a failed run as an annotation, readable without the full log.
      - name: Say what failed
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, sys
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          text = pathlib.Path("pytest.log").read_text(encoding="utf-8", errors="replace")
          tail = "\n".join(text.splitlines()[-45:])[-3500:]
          print("::error title=pytest::" + tail.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY
      - name: The server starts and answers
        shell: bash
        run: |
          python -m ninaivu_lite --no-browser --port 8080 --data "$RUNNER_TEMP/nl-data" &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/api/health && exit 0
            sleep 1
          done
          echo "server did not answer" && exit 1
