name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Also run by the release workflow, on the exact commit it publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  # A release's own run never cancels, and is never cancelled by, another.
  group: tests-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref_type != 'tag' }}

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The oldest Python Ninaivu Lite runs on from source, and exactly the
        # one the installers carry (.python-version; tests/test_python_version.py
        # keeps this line in step with it).
        python-version: ["3.10", "3.13.7"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -rfE --tb=short 2>&1 | tee pytest.log
      # The end of a failed run as an annotation, readable without the full log.
      - name: Say what failed
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, sys
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          log = pathlib.Path("pytest.log")
          text = log.read_text(encoding="utf-8", errors="replace") if log.exists() else "Tests did not start; check the preceding setup or lint step."
          tail = "\n".join(text.splitlines()[-45:])[-3500:]
          print("::error title=pytest::" + tail.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY
      - name: The server starts and answers
        shell: bash
        run: |
          python -m ninaivu_lite --no-browser --port 8080 --data "$RUNNER_TEMP/nl-data" > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/api/health && exit 0
            sleep 1
          done
          # Said as an annotation, so the reason is readable without the full log.
          tail=$( (cat server.log; tail -n 20 "$RUNNER_TEMP/nl-data/logs/ninaivu-lite.log" 2>/dev/null) | tail -n 40 | tr '\n' '~' | sed 's/~/%0A/g')
          echo "::error title=server did not answer::$tail"
          exit 1

  # The stylesheets and scripts checked for mistakes (package.json), and the
  # whole suite again with what the other jobs leave out, so that nothing is
  # only ever skipped: a real browser (every tests/*_browser.py, and the other
  # pages the tests open in Chromium), ffmpeg for videos, OpenCV for the
  # optional face straightening, and a screen (Xvfb) for the Control Panel.
  # Naming one test file here left the film-roll scroll and the phone
  # long-press tests skipped in every run (A256).
  browser:
    name: Lint and browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Lint the stylesheets and scripts
        run: |
          npm ci
          npm run lint
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-browser.txt -r requirements-straighten.txt
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends ffmpeg xvfb
      - name: Every test, with a browser, ffmpeg, OpenCV and a screen
        env:
          # Here a missing browser is a failure, not a skip.
          NINAIVU_BROWSER_TESTS: "1"
        # -rs first: what was still skipped (only what needs another system)
        # is listed above any failure.
        run: xvfb-run -a python -m pytest -rsfE --tb=short
