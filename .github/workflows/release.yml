name: Release installers

# On a version tag: the Windows installer (pynsist), the macOS app and disk
# image for both architectures, and the Linux / Raspberry Pi installer for both
# architectures, all attached to the GitHub release with their checksums.
# Every installer carries its own Python and every package.
#
# Signing is real only when the secrets exist. Without them every job still
# builds, unsigned, and the release notes say so.
#
#   SIGNPATH_API_TOKEN                                   free signing by SignPath Foundation
#     with the repository variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG
#     and SIGNPATH_SIGNING_POLICY_SLUG (docs/CODE-SIGNING.md); used for tags and
#     "Run workflow" only, and each request waits for approval in SignPath
#   WINDOWS_SIGN_PFX_BASE64, WINDOWS_SIGN_PFX_PASSWORD   or: a code-signing certificate of your own
#   MAC_SIGN_P12_BASE64, MAC_SIGN_P12_PASSWORD           a Developer ID Application certificate
#   MAC_SIGN_IDENTITY                                    its name, "Developer ID Application: … (TEAMID)"
#   MAC_NOTARY_APPLE_ID, MAC_NOTARY_TEAM_ID, MAC_NOTARY_PASSWORD   an app-specific password
#
# A tag push (v1.2.0) is the usual way. "Run workflow" on a branch builds the
# same installers and publishes them as the release for the version in
# ninaivu_lite/version.py, making that tag at the commit it ran on.
# A push that changes the installers on any branch builds them too (and tries
# the Linux one), without publishing anything: the release job runs only for a
# tag or "Run workflow".
on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths: ["installers/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The whole test suite, on every OS, for the very commit being released:
  # nothing is published unless it passes.
  tests:
    name: Tests
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/tests.yml

  windows:
    name: Windows installer
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      HAS_PFX: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 != '' }}
      # Signed by SignPath only for a real release, and only once it is set up.
      USE_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install pynsist and NSIS
        run: |
          pip install pynsist
          choco install nsis -y --no-progress
      - name: Import the signing certificate
        if: env.HAS_PFX == 'true'
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX))
          $cert = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force)
          Remove-Item $path
          "NINAIVU_SIGN_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
      # The uninstaller is signed too, so it is made on its own first
      # (installers/windows/build.ps1): build, write the uninstaller, sign it,
      # pack it into the installer, sign the installer. The same steps run
      # unsigned on every build, so the path is always the tested one.
      - name: Build, and write the uninstaller
        shell: pwsh
        run: |
          & installers\windows\build.ps1 -MakeUninstaller *>&1 | Tee-Object -FilePath build.log
          New-Item -ItemType Directory -Force installers\windows\build\uninstaller-final | Out-Null
          Copy-Item installers\windows\build\uninstaller\uninstall.exe installers\windows\build\uninstaller-final\

      # SignPath takes a file from a workflow artifact, checks that it was built
      # here from this repository, waits for the approval, and hands it back signed.
      - name: The unsigned uninstaller, for SignPath
        id: unsigned-uninstaller
        if: env.USE_SIGNPATH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned-uninstaller
          path: installers/windows/build/uninstaller/uninstall.exe
      - name: Sign the uninstaller with SignPath
        if: env.USE_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-uninstaller.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: installers/windows/build/uninstaller-final
      - name: Sign the uninstaller with the certificate
        if: env.USE_SIGNPATH != 'true' && env.NINAIVU_SIGN_THUMBPRINT != ''
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /sha1 $env:NINAIVU_SIGN_THUMBPRINT /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "Ninaivu Lite" installers\windows\build\uninstaller-final\uninstall.exe

      - name: The installer, carrying that uninstaller
        shell: pwsh
        run: |
          $uninstaller = "installers\windows\build\uninstaller-final\uninstall.exe"
          if ($env:USE_SIGNPATH -eq "true" -and (Get-AuthenticodeSignature $uninstaller).Status -ne "Valid") { throw "The uninstaller came back unsigned" }
          & installers\windows\build.ps1 -Finalize -Uninstaller $uninstaller -Sign:([bool]$env:NINAIVU_SIGN_THUMBPRINT -and $env:USE_SIGNPATH -ne "true") *>&1 | Tee-Object -FilePath build.log -Append
      # The end of a failed build as an annotation, readable without the full log.
      - name: Say what failed
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, sys
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          log = pathlib.Path("build.log")
          text = log.read_text(encoding="utf-8", errors="replace") if log.exists() else "Build did not start; check the preceding setup or signing step."
          tail = "\n".join(text.splitlines()[-45:])[-3500:]
          print("::error title=Windows build::" + tail.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY

      - name: The unsigned installer, for SignPath
        id: unsigned
        if: env.USE_SIGNPATH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: installers/windows/build/nsis/*.exe
      - name: Sign the installer with SignPath
        if: env.USE_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: installers/windows/build/signed
      - name: Use the signed installer
        if: env.USE_SIGNPATH == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem installers\windows\build\signed\*.exe
          if (-not $signed) { throw "SignPath returned no installer" }
          Copy-Item $signed.FullName installers\windows\build\nsis\ -Force
          $signature = Get-AuthenticodeSignature (Join-Path installers\windows\build\nsis $signed.Name)
          if ($signature.Status -ne "Valid") { throw "The installer's signature is $($signature.Status)" }
          Write-Host "Signed by $($signature.SignerCertificate.Subject)"

      # What a person will do with it: install, open, start, stop, remove.
      - name: Install it, start it, ask it how it is, remove it
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          trap {
            $text = ($_ | Out-String).Trim() -replace "%", "%25" -replace "`r", "" -replace "`n", "%0A"
            Write-Host "::error title=Windows install test::$text"
            break
          }
          $installer = (Get-ChildItem installers\windows\build\nsis\Ninaivu-Lite-*-windows-x64.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP "Ninaivu Lite"
          $data = Join-Path $env:RUNNER_TEMP "nl-data"
          Start-Process -FilePath $installer -ArgumentList "/S", "/INSTDIR=$dir" -Wait
          $python = Join-Path $dir "Python\python.exe"
          foreach ($file in @($python, (Join-Path $dir "Python\pythonw.exe"), (Join-Path $dir "uninstall.exe"))) {
            if (-not (Test-Path $file)) { throw "not installed: $file" }
          }
          # The uninstaller on disk is the one that was packed, not one written at install time.
          $packed = (Get-FileHash installers\windows\build\uninstaller-final\uninstall.exe).Hash
          if ((Get-FileHash (Join-Path $dir "uninstall.exe")).Hash -ne $packed) { throw "the installed uninstaller is not the packed one" }
          # The Control Panel's window opens with the private Python (Tk is inside), and the app's packages load.
          & $python -c "import tkinter, flask, PIL, waitress, ninaivu_lite.panel, ninaivu_lite.app; r = tkinter.Tk(); r.update(); r.destroy(); import ninaivu_lite; print('Ninaivu Lite', ninaivu_lite.__version__, 'Tk', tkinter.TkVersion)"
          if ($LASTEXITCODE) { throw "the installed Python could not open the Control Panel" }
          Start-Process -FilePath (Join-Path $dir "Python\pythonw.exe") -ArgumentList "-m", "ninaivu_lite", "--no-browser", "--data", "`"$data`""
          $up = $false
          foreach ($i in 1..40) {
            try { $health = Invoke-RestMethod http://127.0.0.1:8080/api/health -TimeoutSec 2; $up = $true; break } catch { Start-Sleep 1 }
          }
          if (-not $up) { Get-Content (Join-Path $data "logs\ninaivu-lite.log") -ErrorAction SilentlyContinue; throw "the installed server did not answer" }
          Write-Host "answering: $($health.app) $($health.version)"
          (Invoke-WebRequest http://127.0.0.1:8080/ -UseBasicParsing).StatusCode
          & $python -m ninaivu_lite.control --data $data --stop --status
          # The installed folder, stopped, is what the portable zip carries (next step).
          Copy-Item -Recurse $dir (Join-Path $env:RUNNER_TEMP "portable-source")
          # _?= makes the uninstaller run in place and wait, instead of copying itself away.
          Start-Process -FilePath (Join-Path $dir "uninstall.exe") -ArgumentList "/S", "_?=$dir" -Wait
          if (Test-Path (Join-Path $dir "pkgs")) { throw "uninstall left the program behind" }
          Write-Host "installed, ran, stopped and removed"

      # The same program as a zip that runs from wherever it is extracted (a
      # folder, a pendrive), with nothing installed: the installed folder
      # without its uninstaller, a launcher that keeps the data folder beside
      # it, and a note in English and Tamil (installers/windows/portable/).
      - name: The portable zip, and try it
        shell: pwsh
        env:
          # The test path has Tamil letters, which the runner's cp1252 console cannot print.
          PYTHONIOENCODING: utf-8
        run: |
          $ErrorActionPreference = "Stop"
          trap {
            $text = ($_ | Out-String).Trim() -replace "%", "%25" -replace "`r", "" -replace "`n", "%0A"
            Write-Host "::error title=Windows portable zip::$text"
            break
          }
          $installer = Get-ChildItem installers\windows\build\nsis\Ninaivu-Lite-*-windows-x64.exe
          $zip = Join-Path $installer.DirectoryName ($installer.BaseName + "-portable.zip")
          $source = Join-Path $env:RUNNER_TEMP "portable-source"
          Remove-Item (Join-Path $source "uninstall.exe")
          Get-ChildItem $source -Recurse -Directory -Filter "__pycache__" | Remove-Item -Recurse -Force
          Copy-Item installers\windows\portable\* $source
          # One folder inside the zip, so Extract All gives "Ninaivu Lite" and not loose files.
          $stage = Join-Path $env:RUNNER_TEMP "portable-stage"
          New-Item -ItemType Directory $stage | Out-Null
          Move-Item $source (Join-Path $stage "Ninaivu Lite")
          Compress-Archive -Path (Join-Path $stage "Ninaivu Lite") -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "$zip $([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB"

          # Extracted somewhere else, with a space and Tamil letters in the path.
          $out = Join-Path $env:RUNNER_TEMP "கையடக்கம் test"
          Expand-Archive $zip -DestinationPath $out
          $dir = Join-Path $out "Ninaivu Lite"
          foreach ($file in @("Python\pythonw.exe", "Ninaivu Lite Control Panel.vbs", "README-PORTABLE.txt")) {
            if (-not (Test-Path (Join-Path $dir $file))) { throw "not in the zip: $file" }
          }
          if (Test-Path (Join-Path $dir "uninstall.exe")) { throw "the zip carries the uninstaller" }
          $data = Join-Path $dir "data"

          # The launcher opens the Control Panel with the data folder beside it.
          Start-Process -FilePath "wscript.exe" -ArgumentList "`"$(Join-Path $dir 'Ninaivu Lite Control Panel.vbs')`""
          $panel = $null
          foreach ($i in 1..30) {
            $panel = Get-CimInstance Win32_Process -Filter "Name = 'pythonw.exe'" | Where-Object { $_.CommandLine -like "*ninaivu_lite.panel*" }
            if ($panel) { break } else { Start-Sleep 1 }
          }
          if (-not $panel) { throw "the launcher did not open the Control Panel" }
          Write-Host "Control Panel: $($panel.CommandLine)"
          if ($panel.CommandLine -notlike "*--data `"$data`"*") { throw "the Control Panel was not given the folder's own data folder" }
          Start-Sleep 3
          if (-not (Get-Process -Id $panel.ProcessId -ErrorAction SilentlyContinue)) { throw "the Control Panel closed as it opened" }
          Stop-Process -Id $panel.ProcessId

          # What its Start button runs, from the extracted copy.
          $python = Join-Path $dir "Python\python.exe"
          Push-Location $dir
          try {
            & $python -c "import tkinter, ninaivu_lite, ninaivu_lite.panel, ninaivu_lite.app; r = tkinter.Tk(); r.update(); r.destroy(); print('portable', ascii(ninaivu_lite.__file__))"
            if ($LASTEXITCODE) { throw "the extracted Python could not load Ninaivu Lite" }
            Start-Process -FilePath (Join-Path $dir "Python\pythonw.exe") -ArgumentList "-m", "ninaivu_lite", "--no-browser", "--data", "`"$data`""
            $up = $false
            foreach ($i in 1..40) {
              try { $health = Invoke-RestMethod http://127.0.0.1:8080/api/health -TimeoutSec 2; $up = $true; break } catch { Start-Sleep 1 }
            }
            if (-not $up) { Get-Content (Join-Path $data "logs\ninaivu-lite.log") -ErrorAction SilentlyContinue; throw "the portable server did not answer" }
            Write-Host "answering: $($health.app) $($health.version)"
            & $python -m ninaivu_lite.control --data $data --stop --status
          } finally { Pop-Location }
          if (-not (Test-Path (Join-Path $data "ninaivu-lite.db"))) { throw "the data did not stay in the extracted folder" }
          Write-Host "extracted, opened, ran and stopped, with its data beside it"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            installers/windows/build/nsis/*.exe
            installers/windows/build/nsis/*-portable.zip

  macos:
    name: macOS app (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      HAS_P12: ${{ secrets.MAC_SIGN_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Import the signing certificate
        if: env.HAS_P12 == 'true'
        env:
          P12: ${{ secrets.MAC_SIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_SIGN_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.MAC_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.MAC_NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.MAC_NOTARY_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security import "$RUNNER_TEMP/sign.p12" -P "$P12_PASSWORD" -A -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/sign.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          xcrun notarytool store-credentials ninaivu-lite --apple-id "$APPLE_ID" --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" --keychain "$keychain"
          echo "NINAIVU_MAC_SIGN_IDENTITY=${{ secrets.MAC_SIGN_IDENTITY }}" >> "$GITHUB_ENV"
          echo "NINAIVU_NOTARY_PROFILE=ninaivu-lite" >> "$GITHUB_ENV"
          echo "NINAIVU_NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Build
        run: bash installers/macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: installers/macos/build/*.dmg

  linux:
    name: Linux and Raspberry Pi (${{ matrix.arch }})
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Build
        run: bash installers/linux/build.sh ${{ matrix.arch }}
      - name: Install it, start it, ask it how it is, remove it
        if: matrix.arch == 'amd64'
        run: |
          sh installers/linux/build/*.sh --quiet --no-service
          ~/.local/bin/ninaivu-lite --version
          ~/.local/bin/ninaivu-lite --no-browser > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ > /dev/null
          ~/.local/lib/ninaivu-lite/python/bin/python3 -m ninaivu_lite.control --stop --status
          ~/.local/lib/ninaivu-lite/uninstall
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: installers/linux/build/*.sh

  release:
    permissions:
      contents: write
    name: Attach to the release
    needs: [tests, windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only a version tag or "Run workflow" publishes. A push that merely
    # changes the installers builds and tries them, and stops there.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    env:
      HAS_PFX: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 != '' || secrets.SIGNPATH_API_TOKEN != '' }}
      HAS_NOTARY: ${{ secrets.MAC_SIGN_P12_BASE64 != '' && secrets.MAC_NOTARY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: The version being released
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then version=${GITHUB_REF_NAME#v}
          else version=$(sed -nE 's/^__version__ *= *"([^"]+)".*/\1/p' src/ninaivu_lite/version.py); fi
          [ -n "$version" ] || { echo "no version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Checksums
        run: |
          rm -rf out/windows-unsigned out/windows-unsigned-uninstaller
          mkdir files && find out -type f \( -name "*.exe" -o -name "*-portable.zip" -o -name "*.dmg" -o -name "*.sh" \) -exec cp {} files/ \;
          (cd files && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Release notes
        run: |
          version=$VERSION
          {
            echo "Ninaivu Lite $version — your family's photographs, at home."
            echo
            echo "**Windows:** \`Ninaivu-Lite-$version-windows-x64.exe\`, or \`Ninaivu-Lite-$version-windows-x64-portable.zip\` to run without installing (extract it, then open *Ninaivu Lite Control Panel.vbs*; its data stays in the folder). **macOS:** the \`.dmg\` for Apple silicon (\`arm64\`) or Intel (\`x86_64\`). **Linux and Raspberry Pi:** \`Ninaivu-Lite-$version-linux-amd64.sh\` for a PC, \`-linux-arm64.sh\` for a Raspberry Pi 4 or 5 with a 64-bit OS — run it with \`sh\`, no root needed."
            echo "Every installer carries its own Python and every package: nothing is downloaded at install time. Checksums are in \`SHA256SUMS.txt\`."
            echo
            if [ "$HAS_PFX" != "true" ]; then
              echo "> **The Windows installer is not signed.** SmartScreen will say *Windows protected your PC*: choose **More info → Run anyway**."
              echo
            fi
            if [ "$HAS_NOTARY" != "true" ]; then
              echo "> **The Mac app is not signed or notarised.** Open it once, then go to **System Settings → Privacy & Security** and choose **Open Anyway**."
              echo
            fi
            echo "## What is in $version"
            awk -v v="$version" '$0 ~ "^## "v" " {on=1; next} on && /^## / {exit} on' src/CHANGELOG.md
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Ninaivu Lite v${{ env.VERSION }}
          body_path: notes.md
          files: files/*
