name: Feature request
description: Suggest an improvement for Ninaivu Lite.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the household use case and any current workaround.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested improvement
      description: Explain how you would like it to work in this lightweight, home-network gallery.
    validations:
      required: true
